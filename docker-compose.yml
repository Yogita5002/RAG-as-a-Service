# Local stack: PostgreSQL + pgvector, Ollama, and the FastAPI backend.
# Start:  docker compose up -d --build
# Models: docker compose exec ollama ollama pull nomic-embed-text
#         docker compose exec ollama ollama pull llama3.2
# Docs:   http://localhost:8000/docs

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rag
      MODEL_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      LLM_MODEL: llama3.2
      EMBEDDING_DIMENSION: "768"
      CHUNK_SIZE: "800"
      CHUNK_OVERLAP: "150"
      TOP_K: "5"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama:
